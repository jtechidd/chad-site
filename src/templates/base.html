{% import "macros.html" as macros with context %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>windriftz - {{ page_title }}</title>
    <link rel="stylesheet" href="/assets/css/98.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    {% block head %}{% endblock %}
</head>

<body>
    <div class="container">
        <main class="main {{ main_class | default('base') }}">
            <a id="top"></a>
            {{ macros.site_header() }}
            {% block main %}{% endblock %}
            {{ macros.site_footer() }}
        </main>
    </div>
</body>

</html>
