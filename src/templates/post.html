{% import "macros.html" as macros with context %}

{% extends "base.html" %}
{% set main_class = "post" %}

{% block head %}
<link rel="stylesheet" href="/assets/css/post.css">
<script defer src="/assets/js/post.js"></script>
{% endblock %}

{% block main %}

{{ macros.back_to_top() }}
<hr>
{% endblock %}
